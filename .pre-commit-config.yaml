repos:
- repo: https://github.com/antonbabenko/pre-commit-terraform
  rev: v1.104.0
  hooks:
    - id: terraform_validate
    - id: terraform_fmt
      args:
      - --args=-recursive
    - id: terraform_tflint
- repo: https://github.com/terraform-docs/terraform-docs
  rev: v0.20.0
  hooks:
    - id: terraform-docs-go
      language: system
      args: ["markdown", "table", "--output-file", "README.md", "./datadog_website_monitor"]
